services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_INIT DB_ARGS=--auth=scram-sha-256'  # ← Изменено!
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    ports:
      - '54321:5432'

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'

volumes:
  postgres_data:
  redis_data: